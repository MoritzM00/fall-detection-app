name: Claude Code Review

on:
  pull_request:
    # One review when a PR is declared finished, not on every push.
    # Add the "claude-review" label to request another review before merging.
    types: [opened, ready_for_review, labeled]

jobs:
  claude-review:
    if: |
      (github.event.action != 'labeled' && !github.event.pull_request.draft) ||
      (github.event.action == 'labeled' && github.event.label.name == 'claude-review')

    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # A single Opus pass with the repository checked out. The code-review
      # plugin used before never started its reviewer subagents in CI and only
      # flagged bugs visible in the diff alone, so it reported nothing.
      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request before it is merged. The workspace is the
            PR merged into its base branch, so you can read any file.

            1. Read the PR title and description (`gh pr view`), every issue it
               closes or references (`gh issue view <n> --comments`, which
               includes decisions recorded in comments), and `AGENTS.md`.
            2. Read the full diff (`gh pr diff`). For each changed file, read
               enough of the surrounding code with Read, Grep and Glob to
               understand the change in context, including callers.
            3. Look for problems a careful senior engineer would want fixed
               before merging:
               - wrong logic, unhandled edge cases, races, resource leaks, and
                 error handling that loses information or leaves state
                 inconsistent;
               - security and privacy problems: credentials, untrusted input,
                 paths, and personal data such as camera frames;
               - violations of the rules in `AGENTS.md`;
               - acceptance criteria of the linked issue that are not met or
                 not tested, and tests that would still pass if the change
                 were broken;
               - documentation that now contradicts the code.
               Skip style preferences and problems that exist only outside
               this change.
            4. Check every candidate finding against the code before reporting
               it, and drop anything you cannot confirm.
            5. Post each confirmed finding as an inline comment on the relevant
               line with `mcp__github_inline_comment__create_inline_comment`
               and `confirmed: true`. Say what is wrong, give a concrete
               failure scenario, and suggest a fix.
            6. Finish with one summary comment (`gh pr comment`) that starts
               with "## Code review". Give the number of findings per severity
               (blocking, should fix, minor), one line per finding, and a short
               list of what you checked. If you found nothing, say so and list
               what you checked.
          claude_args: >-
            --model claude-opus-5-5
            --allowedTools "Read,Grep,Glob,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh issue view:*),mcp__github_inline_comment__create_inline_comment"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
