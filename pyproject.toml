[project]
name = "fall-detection-app"
version = "0.1.0"
description = "Extensible MVP for video-based activity and fall detection"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "av>=14,<17",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "numpy>=2,<3",
    "pillow>=11,<13",
    "python-multipart>=0.0.20,<1",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "pre-commit>=4.2,<5",
    "pytest>=8.3,<9",
    "ruff>=0.11,<1",
    "ty>=0.0.1a18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fall_detection", "apps"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["A", "B", "C4", "D", "E", "F", "I", "N", "PTH", "SIM", "UP"]
ignore = ["A003", "D100", "D104", "E501"]

[tool.ruff.lint.extend-per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.src]
include = ["src", "apps", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--import-mode=importlib"]
